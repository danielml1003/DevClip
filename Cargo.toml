[workspace]
members = ["crates/devclip-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DevClip"]

[profile.release]
# Optimise for a small, fast-starting binary — one of DevClip's core goals.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
