name: Release DevClip

# Triggered by pushing a version tag (e.g. `v0.1.0`):
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# Builds the Windows + macOS installers and publishes them as a GitHub Release,
# which gives stable, public, permanent download links (no login, no expiry) and
# a `…/releases/latest` URL. Unsigned, like the CI builds.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create & release (e.g. v0.1.0)"
        required: true
        type: string

# The release job needs to create a Release (and the tag, when dispatched
# manually) and upload assets.
permissions:
  contents: write

# The tag comes from the pushed ref, or from the manual input when dispatched.
env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Run core tests
        run: cargo test -p devclip-core

      - name: Build DevClip (Windows installer)
        run: npm run tauri build
        env:
          # Stamp the release version into the UI footer.
          DEVCLIP_BUILD: ${{ env.RELEASE_TAG }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build DevClip (universal macOS .dmg)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          DEVCLIP_BUILD: ${{ env.RELEASE_TAG }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag at this commit if it doesn't already exist (the
          # manual-dispatch path); reuses the pushed tag otherwise.
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: DevClip ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Install

            These are **unsigned** builds, so your OS warns on first launch.

            **Windows** — download the `.exe` (or `.msi`). SmartScreen shows
            *"Windows protected your PC"* → **More info → Run anyway**. Press
            **Alt+Space** to open DevClip.

            **macOS** — download the universal `.dmg` (Apple Silicon + Intel),
            drag DevClip to Applications, then **right-click → Open** (or run
            `xattr -cr /Applications/DevClip.app`). Grant Accessibility
            permission so the hotkey and paste work; the hotkey is
            **Option+Space**.
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
