name: Build DevClip (Windows + macOS)

# Builds real, downloadable installers for both platforms and uploads them as
# artifacts:
#   * Windows: .msi + .exe  — SmartScreen warns on first run (unsigned).
#   * macOS:   .dmg (universal, Apple Silicon + Intel) — Gatekeeper blocks it on
#     first run (unsigned): right-click the app → Open, or run
#     `xattr -cr /Applications/DevClip.app`. Proper fix is an Apple Developer
#     account for signing + notarization.

on:
  push:
    branches: [devclip-app]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Run core tests
        run: cargo test -p devclip-core

      - name: Compute build identifier
        id: build
        shell: bash
        run: echo "id=#${{ github.run_number }} ${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build DevClip (frontend + Tauri installer)
        run: npm run tauri build
        env:
          # Baked into the UI so we can confirm which build is running.
          DEVCLIP_BUILD: ${{ steps.build.outputs.id }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: devclip-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both arches so we can bundle a single universal .dmg.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Compute build identifier
        id: build
        run: echo "id=#${{ github.run_number }} ${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build DevClip (universal macOS .dmg)
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          DEVCLIP_BUILD: ${{ steps.build.outputs.id }}

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: devclip-macos-installer
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
