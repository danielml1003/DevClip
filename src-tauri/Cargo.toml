[package]
name = "devclip-tauri"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "DevClip desktop shell (Tauri v2)."
default-run = "devclip-tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
devclip-core = { path = "../crates/devclip-core" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Synthetic keystrokes for "paste into the focused app" (macOS/Linux path).
[target.'cfg(not(windows))'.dependencies]
enigo = "0.2"

# Windows-specific: restore focus to the previously active window and inject a
# real Ctrl+V keydown via SendInput. This is what makes paste reliable in apps
# like Discord (Electron/Chromium) and removes the perceptible delay.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
